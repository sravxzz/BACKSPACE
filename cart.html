<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Backspace Go</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { cream: '#FAF9F6', charcoal: '#2D2D2D', brown: '#8B5A2B', accent: '#A0522D' }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } } }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/products-api.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="js/app.js"></script>
</head>
<body class="bg-cream text-charcoal antialiased flex flex-col min-h-screen">
  
  <nav class="sticky top-0 z-50 bg-cream/90 backdrop-blur-md border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex justify-between items-center h-20">
        <a href="index.html" class="text-2xl font-bold tracking-tight text-charcoal">BACKSPACE GO</a>
        <a href="index.html" class="text-gray-500 hover:text-charcoal"><i class="ph ph-x text-2xl"></i></a>
      </div>
    </div>
  </nav>

  <main class="flex-grow max-w-4xl mx-auto px-4 w-full py-16" x-data>
    <h1 class="text-4xl font-bold mb-10 text-center">Your Cart</h1>
    
    <template x-if="$store.cart.items.length === 0">
      <div class="text-center py-20 bg-white rounded-3xl shadow-sm border border-gray-100">
        <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-300">
          <i class="ph ph-shopping-cart text-5xl"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2">Your cart is empty</h2>
        <a href="index.html" class="inline-block mt-6 bg-charcoal text-white px-8 py-4 rounded-full font-bold hover:bg-gray-800 transition-colors">Start Shopping</a>
      </div>
    </template>

    <template x-if="$store.cart.items.length > 0">
      <div class="flex flex-col gap-10">
        
        <!-- Items -->
        <div class="space-y-6">
          <template x-for="item in $store.cart.items" :key="item.id + item.size + item.thickness + item.color">
            <div class="bg-white p-6 rounded-2xl flex gap-6 shadow-sm relative items-center">
              <div class="w-24 h-24 bg-gray-50 rounded-xl overflow-hidden flex-shrink-0">
                <img :src="item.image" :alt="item.name" class="w-full h-full object-cover">
              </div>
              <div class="flex-grow">
                <div class="flex justify-between items-start mb-2">
                  <h3 class="font-bold text-lg leading-tight" x-text="item.name"></h3>
                  <button @click="$store.cart.remove(item.id, item.size, item.thickness, item.color)" class="text-gray-400 hover:text-red-500 transition-colors">
                    <i class="ph ph-trash text-xl"></i>
                  </button>
                </div>
                
                <div class="text-sm text-gray-500 mb-3 space-x-2">
                  <span x-show="item.size && item.size !== 'Select Size'" x-text="item.size"></span>
                  <span x-show="item.thickness && item.thickness !== 'Select Thickness'" x-text="`| ${item.thickness}`"></span>
                  <span x-show="item.color && item.color !== 'Select Color'" x-text="`| ${item.color}`"></span>
                </div>
                
                <div class="flex justify-between items-end">
                  <div class="flex items-center border border-gray-200 rounded-lg w-28 h-10">
                    <button @click="$store.cart.updateQuantity(item.id, item.size, item.thickness, item.color, item.quantity - 1)" class="w-8 flex items-center justify-center text-gray-500">-</button>
                    <input type="number" readonly :value="item.quantity" class="w-12 text-center font-bold bg-transparent border-x border-gray-200 h-full">
                    <button @click="$store.cart.updateQuantity(item.id, item.size, item.thickness, item.color, item.quantity + 1)" class="w-8 flex items-center justify-center text-gray-500">+</button>
                  </div>
                  <div class="text-lg font-bold text-brown" x-text="`Price: ${item.priceStr}`"></div>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Checkout Bottom -->
        <div class="bg-white p-8 rounded-3xl shadow-soft">
          <div class="flex justify-between items-center mb-8 border-b border-gray-100 pb-6">
            <span class="text-2xl font-bold">Total</span>
            <span class="text-2xl font-bold text-brown">₹XX,XXX</span>
          </div>
          
          <button @click="window.cartWhatsApp($store.cart.items)" class="w-full bg-[#25D366] text-white py-5 rounded-xl font-bold text-xl hover:bg-[#20bd5a] transition-colors flex items-center justify-center shadow-lg">
            <i class="ph ph-whatsapp-logo text-3xl mr-3"></i> BUY NOW ON WHATSAPP
          </button>
          <p class="text-center text-gray-400 text-sm mt-4">You will be redirected directly to WhatsApp to complete your order.</p>
        </div>
      </div>
    </template>
  </main>
</body>
</html>
